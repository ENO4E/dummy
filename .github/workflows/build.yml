# main に push されたら静的書き出し(npm run build → out/)し、out/ の中身を build ブランチの dist/ に置く。
# サーバー(TaxPlan-org/php)の /web/deploy/dummy/ が Webhook で build ブランチを取り込み、
# public_html/dummy.tax-plan.net/ に配置する(手順は TaxPlan-org/php の docs/deploy.md の 2-2d)
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: out/ を build ブランチの dist/ に push
        run: |
          mkdir -p build-branch/dist
          cp -r out/. build-branch/dist/
          cd build-branch
          git init -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build
